<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreditSathi - हर कामगार का क्रेडिट साथी</title>
<style>
:root { --saffron:#f4930a; --green:#138808; --navy:#0b2a5b; --bg:#fff9f0; --card:#ffffff; --ink:#1f2937; }
* { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI', system-ui, sans-serif; }
body { background:var(--bg); color:var(--ink); min-height:100vh; display:flex; flex-direction:column; align-items:center; }
header { width:100%; max-width:820px; padding:18px 20px 10px; display:flex; align-items:center; gap:12px; }
.logo { width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg, var(--saffron), var(--green)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:20px; }
h1 { font-size:20px; color:var(--navy); }
.sub { font-size:12.5px; color:#6b7280; }
.langswitch { margin-left:auto; font-size:13px; border:1.5px solid var(--saffron); border-radius:20px; padding:6px 14px; background:#fff; cursor:pointer; color:var(--navy); font-weight:600; }
main { width:100%; max-width:820px; flex:1; display:flex; flex-direction:column; padding:0 20px 20px; }
#log { flex:1; overflow-y:auto; padding:10px 0 16px; display:flex; flex-direction:column; gap:10px; min-height:300px; }
.msg { max-width:85%; padding:12px 16px; border-radius:16px; line-height:1.55; font-size:15px; white-space:pre-wrap; }
.ria { background:var(--card); border:1px solid #f0e2cd; border-bottom-left-radius:4px; align-self:flex-start; box-shadow:0 1px 3px rgba(0,0,0,.05); }
.me { background:var(--navy); color:#fff; border-bottom-right-radius:4px; align-self:flex-end; }
.card { background:#fff; border:1.5px solid var(--saffron); border-radius:14px; padding:14px 16px; align-self:stretch; box-shadow:0 2px 8px rgba(244,147,10,.12); }
.card h3 { color:var(--navy); font-size:16px; margin-bottom:4px; }
.card .amt { color:var(--green); font-weight:700; font-size:14px; margin-bottom:8px; }
.card ul { margin:8px 0 8px 18px; font-size:14px; }
.card .apply { font-size:13.5px; background:#fdf3e3; border-radius:8px; padding:8px 10px; margin-top:8px; }
.card .notes { font-size:12.5px; color:#6b7280; margin-top:6px; }
.card button { margin-top:10px; background:var(--green); color:#fff; border:0; border-radius:10px; padding:9px 16px; font-weight:700; cursor:pointer; font-size:14px; }
#composer { display:flex; gap:8px; padding-top:10px; border-top:1px solid #eee2cf; }
#in { flex:1; padding:14px 16px; border-radius:24px; border:1.5px solid #e5d5bd; font-size:15px; outline:none; }
#in:focus { border-color:var(--saffron); }
#send, #mic { border:0; border-radius:50%; width:48px; height:48px; cursor:pointer; font-size:18px; display:flex; align-items:center; justify-content:center; }
#send { background:var(--saffron); color:#fff; font-weight:800; }
#mic { background:#fff; border:1.5px solid var(--saffron); }
#mic.on { background:#ffe1b3; animation:pulse 1.2s infinite; }
@keyframes pulse { 50% { transform:scale(1.08); } }
.hint { font-size:12px; color:#9ca3af; text-align:center; padding-top:6px; }
footer { font-size:12px; color:#9ca3af; padding:10px; text-align:center; }
a { color:var(--navy); }
</style>
</head>
<body>
<header>
  <div class="logo">स</div>
  <div>
    <h1>CreditSathi</h1>
    <div class="sub" id="tagline">हर कामगार का क्रेडिट साथी - सही लोन, सही दस्तावेज़, सही रास्ता</div>
  </div>
  <button class="langswitch" id="langbtn">English</button>
</header>
<main>
  <div id="log"></div>
  <div id="composer">
    <input id="in" placeholder="अपने बारे में बताइए - क्या काम करते हैं, कितना लोन चाहिए..." autofocus>
    <button id="mic" title="बोलिए">🎤</button>
    <button id="send" title="भेजें">➤</button>
  </div>
  <div class="hint" id="hint">बोलकर या लिखकर पूछिए। कोई OTP/PIN कभी न दें - असली बैंक कभी नहीं मांगते।</div>
</main>
<footer>Code for a Billion 2026 · <a href="/stats">live impact stats</a> · open source (MIT)</footer>
<script>
let lang = 'hi', session = null, history = [];
const T = {
  hi: {
    tagline: 'हर कामगार का क्रेडिट साथी - सही लोन, सही दस्तावेज़, सही रास्ता',
    ph: 'अपने बारे में बताइए - क्या काम करते हैं, कितना लोन चाहिए...',
    hint: 'बोलकर या लिखकर पूछिए। कोई OTP/PIN कभी न दें - असली बैंक कभी नहीं मांगते।',
    greet: 'नमस्ते! मैं साथी हूं। आप क्या काम करते हैं, और कितने पैसों की ज़रूरत है? मैं बताऊंगा कि कौन सी सरकारी स्कीम आपके लिए बनी है, कौन से कागज़ात चाहिए, और आवेदन कैसे करें।',
    btn: 'English', track: 'आवेदन ट्रैक करें', tracked: 'ट्रैकर में जुड़ गया ✓', applyLbl: 'कहां आवेदन करें', docsLbl: 'कागज़ात'
  },
  en: {
    tagline: 'Every worker\'s credit companion - right loan, right documents, right path',
    ph: 'Tell me about yourself - your work, how much money you need...',
    hint: 'Ask by voice or text. Never share OTP/PIN - genuine banks never ask.',
    greet: 'Namaste! I am Saathi. What work do you do, and how much money do you need? I will tell you which government scheme fits you, which documents you need, and how to apply.',
    btn: 'हिंदी', track: 'Track my application', tracked: 'Added to tracker ✓', applyLbl: 'Where to apply', docsLbl: 'Documents'
  }
};
const log = document.getElementById('log');
function add(cls, html) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.innerHTML = html;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}
function schemeCard(m) {
  const t = T[lang];
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = `<h3>${m.scheme}</h3><div class="amt">${m.amount}</div>
    <div style="font-size:14px">${m.for_}</div>
    <b style="font-size:13px">${t.docsLbl}:</b><ul>${m.docs.map(x => `<li>${x}</li>`).join('')}</ul>
    <div class="apply"><b>${t.applyLbl}:</b> ${m.apply}</div>
    <div class="notes">${m.notes}</div>`;
  const b = document.createElement('button');
  b.textContent = t.track;
  b.onclick = async () => {
    await fetch('/api/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sid: session, scheme: m.scheme, step: 'checklist_generated' }) });
    b.textContent = t.tracked; b.disabled = true;
  };
  d.appendChild(b);
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
async function send(text) {
  text = (text || document.getElementById('in').value).trim();
  if (!text) return;
  document.getElementById('in').value = '';
  add('me', text.replace(/</g, '&lt;'));
  history.push({ role: 'user', content: text });
  const thinking = add('ria', '...');
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, history, lang, session }) });
    const j = await r.json();
    thinking.remove();
    if (j.error) { add('ria', 'Error: ' + j.error); return; }
    session = j.session;
    add('ria', (j.reply || '').replace(/</g, '&lt;'));
    history.push({ role: 'assistant', content: j.reply });
    speak(j.reply);
    (j.matches || []).forEach(schemeCard);
  } catch (e) { thinking.remove(); add('ria', 'Network error. Try again.'); }
}
function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text.replace(/[*_#]/g, ''));
    u.lang = lang === 'hi' ? 'hi-IN' : 'en-IN';
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
let rec = null;
document.getElementById('mic').onclick = () => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return alert('Voice not supported in this browser');
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.lang = lang === 'hi' ? 'hi-IN' : 'en-IN'; rec.interimResults = false;
  const btn = document.getElementById('mic'); btn.classList.add('on');
  rec.onresult = e => { const t = e.results[0][0].transcript; rec = null; btn.classList.remove('on'); send(t); };
  rec.onend = () => { rec = null; btn.classList.remove('on'); };
  rec.onerror = () => { rec = null; btn.classList.remove('on'); };
  rec.start();
};
document.getElementById('langbtn').onclick = () => {
  lang = lang === 'hi' ? 'en' : 'hi';
  const t = T[lang];
  document.getElementById('langbtn').textContent = t.btn;
  document.getElementById('tagline').textContent = t.tagline;
  document.getElementById('in').placeholder = t.ph;
  document.getElementById('hint').textContent = t.hint;
  document.documentElement.lang = lang;
};
document.getElementById('send').onclick = () => send();
document.getElementById('in').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
add('ria', T.hi.greet);
</script>
</body>
</html>
